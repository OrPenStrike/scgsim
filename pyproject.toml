[build-system]
requires = ["setuptools>=77"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "scgsim"
version = "1.0.2"
description = "Research-first electromagnetic simulation workflows for superconducting circuits."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "plotly>=6.0.0",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
aedt = [
    "gdstk",
    "pyaedt==1.3.0",
]
aedt-epr = [
    "gdstk",
    "pyaedt==1.3.0",
    "gdsfactory>=9,<10",
    "klayout>=0.30,<0.31",
]
palace = [
    "gdsfactory>=9,<10",
    "gdstk",
    "gmsh",
]
visualization = [
    "meshio>=5.3,<6",
    "pillow>=11,<13",
    "pyvista[jupyter]>=0.48,<0.49",
]
dev = [
    "jupytext",
    "nbformat",
]

[project.urls]
Homepage = "https://github.com/OrPenStrike/scgsim"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["scgsim._agent_knowledge*"]

[tool.setuptools.package-data]
scgsim = [
    "_agent_knowledge/manifest.json",
    "_agent_knowledge/README.md",
    "_agent_knowledge/docs/*.qmd",
    "_agent_knowledge/docs/**/*.qmd",
    "_agent_knowledge/docs/assets/*",
    "_agent_knowledge/docs/assets/**/*",
]
