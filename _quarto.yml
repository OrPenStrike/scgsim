project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - docs/*.qmd
    - docs/specs/*.qmd
    - docs/course/*.qmd
    - docs/tutorials/*.qmd
    - docs/history/*.qmd
    - docs/concepts/*.qmd

execute:
  enabled: false

website:
  title: "SCGSim"
  description: "Source geometry, explicit solver handoffs and verified electromagnetic results"
  page-navigation: true
  search:
    location: navbar
    type: overlay
  repo-url: https://github.com/NCUPHY-LTLab/scgsim
  repo-actions: [source, issue]
  page-footer:
    right:
      - text: "Contributing"
        href: docs/contributing.qmd
  navbar:
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Tutorial"
        href: docs/examples.qmd
      - text: "Concept"
        href: docs/concepts/problems.qmd
      - text: "Contract"
        href: docs/reference.qmd
      - text: "Contribution"
        href: docs/contributing.qmd
  sidebar:
    - id: overview
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - text: "SCGSim overview"
          href: index.qmd
    - id: tutorial
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/examples.qmd
        - docs/course/installation.qmd
        - section: "By simulation goal"
          contents:
            - docs/tutorials/capacitance.qmd
            - docs/tutorials/resonance.qmd
            - docs/tutorials/resonance-epr.qmd
            - docs/tutorials/scattering.qmd
            - docs/tutorials/transmission-line.qmd
        - section: "Prepare and inspect a model"
          contents:
            - docs/course/working-model.qmd
            - docs/course/source-observations.qmd
            - docs/course/aedt-inputs.qmd
            - docs/course/solver-observations.qmd
        - section: "Execute and read results"
          contents:
            - docs/course/execute.qmd
            - docs/course/returned-results.qmd
            - docs/course/aedt-saved-fields.qmd
            - docs/course/offline-epr.qmd
        - section: "Backend examples"
          contents:
            - docs/course/palace-electrostatic.qmd
            - docs/course/palace-surface-bands.qmd
            - docs/course/aedt-eigenmode.qmd
            - docs/course/aedt-q3d.qmd
            - docs/course/aedt-hpc-sweep.qmd
        - section: "Flip-chip Xmon examples"
          contents:
            - docs/tutorial-xmon-input.qmd
            - docs/tutorial-xmon-palace.qmd
            - docs/tutorial-xmon-aedt.qmd
        - section: "Historical reference"
          contents:
            - docs/history/aedt-capacitance-pre-v3.qmd
    - id: concept
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/concepts/problems.qmd
        - docs/concepts/geometry.qmd
        - docs/eigenmode-epr.qmd
        - docs/concepts/model-and-numerics.qmd
    - id: contract
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/reference.qmd
        - docs/backend-support.qmd
        - section: "Geometry and physical model"
          contents:
            - docs/geometry-sgb.qmd
            - docs/geometry-preview.qmd
            - docs/specs/physical-representation.qmd
            - docs/specs/palace-electrostatic-sgb.qmd
            - docs/specs/palace-eigenmode.qmd
        - section: "Execution and results"
          contents:
            - docs/specs/aedt-runtime.qmd
            - docs/execution-profiles.qmd
            - docs/mesh-quality.qmd
            - docs/report-model.qmd
            - docs/api-migration.qmd
            - docs/notebook-ux.qmd
    - id: contribution
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/contributing.qmd
        - docs/documentation-map.qmd
        - docs/ownership.qmd
        - section: "Project background"
          contents:
            - docs/architecture.qmd
            - docs/goals-and-upstream.qmd
            - docs/provenance.qmd
            - docs/roadmap.qmd
        - section: "Maintenance records"
          contents:
            - docs/errors.qmd
            - docs/convergence-status.qmd

format:
  askr-html:
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    toc-title: "Sections"
    toc-location: right
    page-layout: article
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
