project:
  type: website
  output-dir: _site
  render:
    - README.md
    - docs/*.qmd
    - docs/specs/*.qmd

execute:
  enabled: false

website:
  title: "SCGSim"
  description: "Independent downstream research toolkit for superconducting-circuit simulation"
  page-navigation: true
  reader-mode: true
  search: true
  repo-url: https://github.com/OrPenStrike/scgsim
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Overview"
        href: README.md
      - text: "Examples"
        href: docs/examples.qmd
      - text: "Architecture"
        href: docs/architecture.qmd
      - text: "Specs"
        href: docs/backend-support.qmd
  sidebar:
    - id: overview
      title: "Overview"
      style: floating
      collapse-level: 1
      contents:
        - text: "Overview"
          href: README.md
        - text: "Goals and upstream relationship"
          href: docs/goals-and-upstream.qmd
        - text: "Roadmap and priorities"
          href: docs/roadmap.qmd
    - id: examples
      title: "Examples"
      style: floating
      collapse-level: 1
      contents:
        - text: "Examples"
          href: docs/examples.qmd
        - text: "Eigenmode and offline EPR"
          href: docs/eigenmode-epr.qmd
        - text: "Notebook UX contracts"
          href: docs/notebook-ux.qmd
    - id: architecture
      title: "Architecture"
      style: floating
      collapse-level: 1
      contents:
        - text: "Architecture and data flow"
          href: docs/architecture.qmd
        - text: "Geometry and SGB Route A/B"
          href: docs/geometry-sgb.qmd
        - text: "Headless geometry preview"
          href: docs/geometry-preview.qmd
        - text: "Execution profiles and handoff"
          href: docs/execution-profiles.qmd
        - text: "Unified report model"
          href: docs/report-model.qmd
        - text: "Tetrahedral mesh quality"
          href: docs/mesh-quality.qmd
    - id: specs
      title: "Specs"
      style: floating
      collapse-level: 1
      contents:
        - text: "Backend support matrix"
          href: docs/backend-support.qmd
        - text: "AEDT Runtime Families"
          href: docs/specs/aedt-runtime.qmd
        - text: "Palace Electrostatic + SGB"
          href: docs/specs/palace-electrostatic-sgb.qmd
        - text: "Provenance and data boundaries"
          href: docs/provenance.qmd
        - text: "Folder tree and ownership"
          href: docs/ownership.qmd

format:
  qdk-html:
    theme:
      light: [default, _extensions/arfiligol/qdk/qdk.scss]
      dark: [default, _extensions/arfiligol/qdk/qdk.scss, _extensions/arfiligol/qdk/qdk-dark.scss]
    css: docs/styles.css
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    page-layout: article
    code-copy: true
